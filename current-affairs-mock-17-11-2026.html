<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="17 नवंबर 2026 करेंट अफेयर्स लाइव मॉक टेस्ट">
<title>17 नवंबर 2026 | Current Affairs Mock Test</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#172033;--muted:#65728a;--line:#e1e7f0;--blue:#2457d6;--green:#16834a;--red:#c53232}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans Devanagari",sans-serif;line-height:1.55}
main{max-width:760px;margin:24px auto;padding:16px}.hero,.question,.result{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 4px 16px #15294b0a}
h1{font-size:clamp(1.4rem,4vw,2rem);margin:0 0 6px}.sub,.muted{color:var(--muted)}.pill{display:inline-block;background:#eaf0ff;color:#214db7;padding:4px 10px;border-radius:99px;font-size:.85rem;font-weight:700}
.progress-row{display:flex;justify-content:space-between;margin:16px 0 8px;color:var(--muted);font-size:.92rem}.track{height:9px;background:#e8edf5;border-radius:20px;overflow:hidden}.bar{height:100%;width:0;background:var(--blue);transition:width .2s}
.question h2{font-size:1.08rem;margin:0 0 12px}.option{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin:8px 0;cursor:pointer}.option:hover{background:#f7f9ff}.option input{margin-top:5px;accent-color:var(--blue)}.option.correct{border-color:var(--green);background:#effaf3}.option.wrong{border-color:var(--red);background:#fff2f2}.explain{margin-top:10px;padding:10px 12px;background:#f2f5fa;border-radius:10px;font-size:.94rem}
button{border:0;border-radius:12px;padding:13px 18px;font-size:1rem;font-weight:700;cursor:pointer}.primary{background:var(--blue);color:white;width:100%}.primary:disabled{opacity:.45;cursor:not-allowed}.secondary{background:#e9eef8;color:#21345b;width:100%;margin-top:10px}.result{text-align:center}.score{font-size:2.5rem;font-weight:800;color:var(--blue)}.hidden{display:none}
footer{text-align:center;color:var(--muted);font-size:.82rem;padding:10px}
</style>
</head>
<body>
<main>
<section class="hero">
  <span class="pill">DAILY LIVE MOCK • 10 QUESTIONS</span>
  <h1>आज के टॉप करेंट अफेयर्स</h1>
  <div class="sub">17 नवंबर 2026 | SSC • Railway • Banking • State PCS</div>
  <div class="progress-row"><span>आपकी प्रगति</span><strong id="progressText">0/10</strong></div>
  <div class="track"><div class="bar" id="progressBar"></div></div>
</section>
<div id="quiz"></div>
<button class="primary" id="submitBtn" disabled>टेस्ट सबमिट करें और रिजल्ट देखें</button>
<section class="result hidden" id="result" aria-live="polite">
  <div class="score" id="score"></div>
  <h2 id="message"></h2>
  <p id="breakdown" class="muted"></p>
  <button class="secondary" id="retryBtn">फिर से टेस्ट दें</button>
</section>
<footer>नोट: परीक्षा में उपयोग से पहले सभी करेंट अफेयर्स तथ्यों को आधिकारिक स्रोतों से सत्यापित करें।</footer>
</main>
<script>
const questions = [
{q:"अक्टूबर 2026 में भारत की थोक महँगाई (WPI) कितनी रही?",o:["8.29%","10.29%","12.29%","14.29%"],a:2,e:"इस प्रश्न का उत्तर प्रकाशित आधिकारिक WPI आँकड़ों से सत्यापित करें।"},
{q:"जनगणना 2027 के दूसरे चरण में 16 नवंबर से स्व-गणना किन राज्यों में शुरू हुई?",o:["बिहार, झारखंड, ओडिशा, बंगाल","गोवा, पंजाब, उत्तर प्रदेश, उत्तराखंड के गैर-बर्फीले क्षेत्र","महाराष्ट्र, गुजरात, राजस्थान, मध्य प्रदेश","केरल, तमिलनाडु, कर्नाटक, आंध्र प्रदेश"],a:1,e:"स्व-गणना की राज्यवार तारीखें आधिकारिक जनगणना अधिसूचना से जाँचें।"},
{q:"अक्टूबर 2026 में 15 वर्ष और उससे अधिक आयु के लोगों की बेरोजगारी दर कितनी रही?",o:["4.1%","4.5%","4.9%","5.7%"],a:2,e:"PLFS की संबंधित मासिक रिपोर्ट से आँकड़ा सत्यापित करें।"},
{q:"ICC अध्यक्ष के रूप में दूसरे लगातार कार्यकाल के लिए किसे फिर चुना गया?",o:["रोजर बिन्नी","जय शाह","सौरव गांगुली","ग्रेग बार्कले"],a:1,e:"ICC की आधिकारिक घोषणा से कार्यकाल और चयन की पुष्टि करें।"},
{q:"भारत–म्यांमार नौसैनिक अभ्यास IMNEX-26 का आठवाँ संस्करण कहाँ समाप्त हुआ?",o:["कोच्चि","मुंबई","विशाखापत्तनम","चेन्नई"],a:2,e:"भारतीय नौसेना की आधिकारिक प्रेस विज्ञप्ति देखें।"},
{q:"राष्ट्रीय खेल बोर्ड (National Sports Board) के अध्यक्ष का पद किसने संभाला?",o:["देवेश चतुर्वेदी","पी.टी. उषा","राजीव मेहता","अभिनव बिंद्रा"],a:0,e:"नियुक्ति संबंधी आधिकारिक सरकारी सूचना से पुष्टि करें।"},
{q:"12वाँ भारत–बेलारूस अंतर-सरकारी आयोग सत्र कहाँ आयोजित हुआ?",o:["मिन्स्क","नई दिल्ली","मुंबई","हैदराबाद"],a:1,e:"विदेश मंत्रालय की आधिकारिक विज्ञप्ति से पुष्टि करें।"},
{q:"COP31 जलवायु सम्मेलन 2026 किस शहर में आयोजित हो रहा है?",o:["पेरिस","दुबई","अंताल्या","बाकू"],a:2,e:"UNFCCC की आधिकारिक COP31 जानकारी देखें।"},
{q:"भारत में राष्ट्रीय प्रेस दिवस कब मनाया जाता है?",o:["14 नवंबर","15 नवंबर","16 नवंबर","17 नवंबर"],a:2,e:"राष्ट्रीय प्रेस दिवस हर वर्ष 16 नवंबर को मनाया जाता है।"},
{q:"RBI की 17 नवंबर 2026 की 2-दिवसीय VRRR नीलामी में कट-ऑफ दर कितनी रही?",o:["5.25%","5.49%","5.75%","6.00%"],a:1,e:"RBI की नीलामी परिणाम सूचना से दर सत्यापित करें।"}
];
const quiz=document.getElementById('quiz'),submitBtn=document.getElementById('submitBtn');
let answers={},submitted=false;
function render(){
 quiz.innerHTML='';
 questions.forEach((q,i)=>{
  const section=document.createElement('section');section.className='question';section.id='q'+i;
  const heading=document.createElement('h2');heading.textContent=`प्रश्न ${i+1}. ${q.q}`;section.appendChild(heading);
  q.o.forEach((opt,j)=>{
   const label=document.createElement('label');label.className='option';
   const radio=document.createElement('input');radio.type='radio';radio.name='q'+i;radio.value=j;radio.checked=answers[i]===j;radio.disabled=submitted;
   radio.addEventListener('change',()=>{answers[i]=j;updateProgress()});
   const span=document.createElement('span');span.textContent=String.fromCharCode(65+j)+'. '+opt;
   label.append(radio,span);section.appendChild(label);
  });
  quiz.appendChild(section);
 });
 updateProgress();
}
function updateProgress(){
 const count=Object.keys(answers).length;
 document.getElementById('progressText').textContent=count+'/10';
 document.getElementById('progressBar').style.width=(count*10)+'%';
 submitBtn.disabled=count===0||submitted;
}
submitBtn.addEventListener('click',()=>{
 if(submitted)return;submitted=true;let score=0;
 questions.forEach((q,i)=>{
  const section=document.getElementById('q'+i);
  [...section.querySelectorAll('.option')].forEach((label,j)=>{
   if(j===q.a)label.classList.add('correct');
   if(answers[i]===j&&j!==q.a)label.classList.add('wrong');
  });
  const exp=document.createElement('div');exp.className='explain';
  exp.innerHTML='<strong>'+(answers[i]===q.a?'✓ सही उत्तर':'✗ सही उत्तर:')+'</strong> '+String.fromCharCode(65+q.a)+'. '+q.o[q.a]+'<br>'+q.e;
  section.appendChild(exp);
  if(answers[i]===q.a)score++;
 });
 document.getElementById('score').textContent=score+'/10';
 document.getElementById('message').textContent=score>=9?'बहुत शानदार!':score>=7?'अच्छा प्रदर्शन!':'अभ्यास जारी रखें—आप बेहतर कर सकते हैं।';
 document.getElementById('breakdown').textContent=`सही: ${score} • गलत या छूटे: ${10-score}`;
 document.getElementById('result').classList.remove('hidden');
 submitBtn.classList.add('hidden');updateProgress();
 document.getElementById('result').scrollIntoView({behavior:'smooth'});
});
document.getElementById('retryBtn').addEventListener('click',()=>{
 answers={};submitted=false;document.getElementById('result').classList.add('hidden');
 submitBtn.classList.remove('hidden');render();window.scrollTo({top:0,behavior:'smooth'});
});
render();
</script>
</body>
</html>
